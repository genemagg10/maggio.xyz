<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 315">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd28a"/>
      <stop offset="55%" stop-color="#ffb36a"/>
      <stop offset="100%" stop-color="#ff8a5b"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fa55a"/>
      <stop offset="100%" stop-color="#3f7e3a"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7bc16f"/>
      <stop offset="100%" stop-color="#4f9b48"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ed87c"/>
      <stop offset="100%" stop-color="#5da352"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="420" height="315" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="320" cy="95" r="34" fill="#fff3c4" opacity="0.95"/>
  <circle cx="320" cy="95" r="26" fill="#ffe184"/>

  <!-- Soft clouds -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="80"  cy="70" rx="28" ry="8"/>
    <ellipse cx="100" cy="64" rx="18" ry="6"/>
    <ellipse cx="180" cy="50" rx="22" ry="6"/>
    <ellipse cx="260" cy="60" rx="18" ry="5"/>
  </g>

  <!-- Back hill -->
  <path d="M0,200 C70,150 140,170 210,160 C280,150 350,180 420,170 L420,315 L0,315 Z"
        fill="url(#hillBack)"/>

  <!-- Mid hill -->
  <path d="M0,235 C60,200 130,215 200,205 C270,195 340,225 420,215 L420,315 L0,315 Z"
        fill="url(#hillMid)"/>

  <!-- Schoolhouse on the back hill -->
  <g transform="translate(108,142)">
    <!-- Bell tower -->
    <rect x="34" y="-2" width="10" height="14" fill="#f3eadb"/>
    <polygon points="32,-2 46,-2 39,-12" fill="#b8412e"/>
    <!-- Body -->
    <rect x="10" y="12" width="60" height="32" fill="#fbf2e2" stroke="#1f1f1f" stroke-width="1.2"/>
    <!-- Roof -->
    <polygon points="6,12 74,12 40,-2" fill="#c44a35" stroke="#1f1f1f" stroke-width="1.2"/>
    <!-- Door -->
    <rect x="34" y="26" width="12" height="18" fill="#7b4a2a" stroke="#1f1f1f" stroke-width="1"/>
    <circle cx="44" cy="35" r="0.9" fill="#ffd166"/>
    <!-- Windows -->
    <rect x="16" y="20" width="10" height="10" fill="#bfe3ff" stroke="#1f1f1f" stroke-width="1"/>
    <line x1="21" y1="20" x2="21" y2="30" stroke="#1f1f1f" stroke-width="0.8"/>
    <line x1="16" y1="25" x2="26" y2="25" stroke="#1f1f1f" stroke-width="0.8"/>
    <rect x="54" y="20" width="10" height="10" fill="#bfe3ff" stroke="#1f1f1f" stroke-width="1"/>
    <line x1="59" y1="20" x2="59" y2="30" stroke="#1f1f1f" stroke-width="0.8"/>
    <line x1="54" y1="25" x2="64" y2="25" stroke="#1f1f1f" stroke-width="0.8"/>
    <!-- Flag -->
    <line x1="40" y1="-12" x2="40" y2="-22" stroke="#1f1f1f" stroke-width="1"/>
    <polygon points="40,-22 50,-19 40,-16" fill="#ef476f"/>
  </g>

  <!-- Trees on mid hill -->
  <g>
    <g transform="translate(40,210)">
      <rect x="-2" y="0" width="4" height="10" fill="#5a3a1f"/>
      <circle cx="0" cy="-4" r="10" fill="#2f6b2c"/>
      <circle cx="-6" cy="2" r="8" fill="#357b32"/>
      <circle cx="6" cy="2" r="8" fill="#357b32"/>
    </g>
    <g transform="translate(360,225)">
      <rect x="-2" y="0" width="4" height="10" fill="#5a3a1f"/>
      <circle cx="0" cy="-4" r="11" fill="#2f6b2c"/>
      <circle cx="-7" cy="2" r="8" fill="#357b32"/>
      <circle cx="7" cy="2" r="8" fill="#357b32"/>
    </g>
    <g transform="translate(285,232)">
      <rect x="-2" y="0" width="4" height="9" fill="#5a3a1f"/>
      <circle cx="0" cy="-3" r="9" fill="#2f6b2c"/>
      <circle cx="-5" cy="2" r="7" fill="#357b32"/>
      <circle cx="5" cy="2" r="7" fill="#357b32"/>
    </g>
  </g>

  <!-- Front hill -->
  <path d="M0,265 C80,235 160,260 230,250 C300,240 360,265 420,255 L420,315 L0,315 Z"
        fill="url(#hillFront)"/>

  <!-- Pulse waveform sweeping across the sky -->
  <g filter="url(#glow)">
    <path d="M0,118 L90,118 L108,118 L118,80 L130,150 L142,100 L156,118 L420,118"
          fill="none" stroke="#ef476f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Heart pulse dot -->
  <circle cx="156" cy="118" r="4" fill="#ef476f"/>

  <!-- LAFAYETTE text -->
  <text x="210" y="42"
        text-anchor="middle"
        font-family="'Arial Black','Impact',sans-serif"
        font-size="34" font-weight="900"
        fill="#ffffff"
        stroke="#1f1f1f" stroke-width="1.5"
        letter-spacing="4">LAFAYETTE</text>

  <!-- PULSE text -->
  <text x="210" y="298"
        text-anchor="middle"
        font-family="'Arial Black','Impact',sans-serif"
        font-size="46" font-weight="900"
        fill="#ffffff"
        stroke="#1f1f1f" stroke-width="2"
        letter-spacing="10">PULSE</text>
</svg>
